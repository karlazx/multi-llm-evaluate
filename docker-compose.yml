services:
  app:
    build: .
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      # 由部署机 .env / CI secrets 注入
      DATABASE_URL: ${DATABASE_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
