name: build-and-push

# 策略（2026-09-05 起）：生产环境只在家庭 NAS（192.168.31.251:8788）。
# CI 只负责构建镜像并推送 GHCR；NAS 在局域网内手动拉取更新（见 deploy/nas/README.md）。
# 云服务器部署已退役（容器已停止），不再通过 CI 部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/karlazx/multi-llm-evaluate

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
