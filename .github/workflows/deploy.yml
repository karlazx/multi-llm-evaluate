name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/karlazx/multi-llm-evaluate

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: SSH 部署到 Ubuntu
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL,ENCRYPTION_KEY,GH_PAT
          script: |
            set -e
            echo "$GH_PAT" | docker login ghcr.io -u karlazx --password-stdin
            docker pull ${{ env.IMAGE }}:latest || { echo "拉取镜像失败，终止部署"; exit 1; }
            docker stop multi-llm-evaluate 2>/dev/null || true
            docker rm multi-llm-evaluate 2>/dev/null || true
            docker run -d --name multi-llm-evaluate \
              --network host \
              -e DATABASE_URL="$DATABASE_URL" \
              -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
              -e HOST=0.0.0.0 \
              --restart unless-stopped \
              ${{ env.IMAGE }}:latest
